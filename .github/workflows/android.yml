name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Vercel deployment URL used by the APK (https://...)
        required: false
  push:
    branches: [main]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed-debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate API URL
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || vars.VERCEL_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository variable VERCEL_API_URL (or pass api_url) to the deployed Next.js URL."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static mobile build
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || vars.VERCEL_API_URL }}
        run: npm run build:mobile

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate icons and splash
        run: npx @capacitor/assets generate --android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: icu-tasklog-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
